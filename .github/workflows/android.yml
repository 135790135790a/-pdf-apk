name: android

# 两条线：
# 1) 平时的 push / PR —— 只跑单测 + debug 包，快速给个「没编译错」的信号；
# 2) 打 tag（v*）—— 跑 lint + 单测 + assembleRelease，并把 APK 传到 Release。
#    签名密钥优先用 Secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），
#    没配置就回退到仓库里那把 keystore/mangashelf.jks。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 日常构建
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 项目里没有 wrapper（当初离线环境没下载成），用 setup-gradle 指定版本
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # ---------------------------------------------------------------- 打 tag 发版
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/mangashelf.jks
            echo "using keystore from secrets"
          else
            echo "::warning::KEYSTORE_BASE64 未配置，使用仓库内 keystore/mangashelf.jks"
          fi

      - name: Lint
        run: gradle :app:lintRelease --no-daemon --stacktrace

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/mangashelf.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK and print checksum
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          TAG=${GITHUB_REF_NAME}
          OUT="app/build/outputs/apk/release/mangashelf-${TAG}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee checksum.txt
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false
          fail_on_unmatched_files: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
